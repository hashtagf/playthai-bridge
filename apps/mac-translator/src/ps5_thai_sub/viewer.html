<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Thai subtitle preview</title>
<style>body{margin:0;background:#10222e;color:#fff;font:24px system-ui}header{padding:24px;color:#a6c9ce;font-size:16px}main{position:fixed;bottom:10vh;left:8vw;right:8vw;text-align:center;font-size:clamp(28px,4vw,56px);white-space:pre-wrap}span{background:#000b;box-decoration-break:clone;padding:8px 16px}span:empty{display:none}</style>
<header>PS5 → Thai · Mac fallback viewer<br>Keep this window beside your game. Captions expire automatically.</header><main aria-live="polite"><span id="caption"></span></main>
<script>const caption=document.getElementById('caption');let last=performance.now();async function poll(){try{const r=await fetch('/caption',{cache:'no-store'});if(!r.ok)throw Error();const c=await r.json();caption.textContent=c.text;last=performance.now()}catch{if(performance.now()-last>1500)caption.textContent=''}setTimeout(poll,150)}poll();</script></html>
