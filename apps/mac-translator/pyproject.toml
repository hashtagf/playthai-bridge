[project]
name = "ps5-thai-sub"
version = "0.3.4"
description = "Microphone English to Thai subtitles for a LAN Android TV overlay"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "numpy>=2.2,<3",
    "sounddevice>=0.5,<0.6",
    "webrtcvad-wheels>=2.0.14,<3",
]
[project.scripts]
ps5-thai-sub = "ps5_thai_sub.cli:main"
send-test-caption = "ps5_thai_sub.cli:send_main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11", "mypy>=1.15"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
[[tool.mypy.overrides]]
module = ["sounddevice", "webrtcvad"]
ignore_missing_imports = true
