name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew assembleDebug lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: tv-overlay-debug
          path: apps/tv-overlay/build/outputs/apk/debug/*.apk
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mac-translator
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy --config-file pyproject.toml src
      - run: uv run pytest -q
      - run: uv run ps5-thai-sub run --demo --demo-once

  mac-ocr:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mac-translator
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run python -c 'from ps5_thai_sub.ocr import WindowOCR; assert WindowOCR().command("--self-test")["text"] == "We have to leave before dawn."'
      - run: uv run python -c 'from ps5_thai_sub.remote_audio import build_helper; build_helper()'
